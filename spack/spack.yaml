# GPU development environment matching ~/code/pcms/pcms-cuda-env.
spack:
  specs:
  - omega-h@develop +kokkos+mpi+shared+tests build_type=RelWithDebInfo %c,cxx=gcc@12.3.0 ^kokkos@4.7.04 +cuda+cuda_lambda+serial~openmp cuda_arch=75 cxxstd=17

  develop:
    omega-h:
      spec: omega-h@=develop
      path: ..

  repos:
    omega_dev: $env/repo/spack_repo/omega_dev

  packages:
    all:
      providers:
        mpi: [mpich]

  concretizer:
    unify: true
    reuse: true

  view: false
